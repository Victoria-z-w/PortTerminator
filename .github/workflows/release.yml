name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = $tag
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building version: $version"

      - name: Publish application
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $publishDir = "${{ github.workspace }}\publish\win-x64"
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          dotnet publish src\PortTerminator.UI\PortTerminator.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=$version `
            -o $publishDir

          if (-not (Test-Path "$publishDir\PortTerminator.Elevated.exe")) {
            throw "PortTerminator.Elevated.exe missing from publish output"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $publishDir = "${{ github.workspace }}\publish\win-x64"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          & $iscc "/DMyAppVersion=$version" "/DPublishDir=$publishDir" "${{ github.workspace }}\installer\setup.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Port Terminator ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/PortTerminator-Setup-${{ steps.version.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
